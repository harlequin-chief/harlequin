# Harlequin node — Docker Compose.
#   cd harlequin/node-dist && docker compose up -d
#
# Brings up one node that syncs the launch chain and serves p2p on 30333. No secrets here; the network
# node-key is generated on first run into the persistent data volume (0600), not an account key.
# Your ACCOUNT (your name in the society) is created separately with `harlequin-node key generate` and
# kept in YOUR password manager — a node needs no account to sync and serve.
services:
  harlequin-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harlequin-node
    restart: unless-stopped
    # NO `entrypoint`/`command` here, on purpose (2026-09-17). This file used to override the image with its
    # own flag list, and Docker drops the image's CMD whenever a compose file sets `entrypoint`. That list
    # had no --bootnodes (the sealed chain spec only carries 127.0.0.1), no --consensus (the binary then
    # defaults to instant-seal), no --blocks-pruning and no txpool fix: `docker compose up` gave a node
    # stuck at genesis with zero peers, published as the easy way in. The ONE flag list is the Dockerfile
    # CMD. The node-key needs no pre-step: a non-authority node creates `--node-key-file` if it is missing
    # (sc-cli node_key_params.rs; only authorities refuse).
    ports:
      - "30333:30333"          # p2p — open this in your firewall to accept peers
    volumes:
      - hlq-data:/data
      # No chain-spec mount: the image already carries the spec, sha256-verified at build. Mounting a local
      # copy over it would replace a checked file with an unchecked one.
    # Hardening: no new privileges, drop all caps (a sync node needs none).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  hlq-data:
