# Build, test and fingerprint the Harlequin node on every push.
#
# Three jobs in parallel, each in a clean Debian 13 container with the tree at the canonical path
# /hlq-build/harlequin (see ops/ci-build.sh — the same script anyone can run locally):
#   check → compile feedback · x86 → reproducible mainnet artifact (.dist) · test → every workspace's tests
# Each job writes its outcome to the branch ci-out/<job>/<branch> as soon as it ends (one commit, replaced
# each run): status.txt with the source commit and tree and the exit code, the full log, and for x86 the
# artifact and its sha — the one anyone can reproduce with ops/ci-build.sh x86.
name: build

on:
  push:
    branches: [main, "ci/**"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        mode: [check, x86, test, rogue]
        # the rogue (lab-only) build runs only on ci/lab* branches
        exclude: ${{ fromJSON(startsWith(github.ref_name, 'ci/lab') && '[]' || '[{"mode":"rogue"}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Free disk space (the Substrate target dir needs ~40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /opt/microsoft /opt/google /usr/local/share/chromium
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - name: Place the tree at the canonical path
        run: |
          sudo mkdir -p /hlq-build/out
          sudo cp -a chain /hlq-build/harlequin
          sudo cp -a ops /hlq-build/ops
      - name: Run ops/ci-build.sh ${{ matrix.mode }} in Debian 13
        env:
          # Debian 13 (trixie) pinned by digest: a moving tag would make an old fingerprint unreproducible.
          IMAGE: debian:trixie@sha256:2dc419c6d7fe3dad0a2f9fd469c34cc90b0f9ba642d8fde837fe3d7d34a0e7f1
          MODE: ${{ matrix.mode }}
        run: |
          set +e
          sudo docker run --rm -v /hlq-build:/hlq-build "$IMAGE" bash /hlq-build/ops/ci-build.sh "$MODE" 2>&1 \
            | sudo tee /hlq-build/out/run.log | tail -n 200
          rc=${PIPESTATUS[0]}
          echo "$rc" | sudo tee /hlq-build/out/rc.txt
          df -h /
          exit $rc
      - name: Write the outcome to ci-out/${{ matrix.mode }}/${{ github.ref_name }}
        if: always()
        env:
          SRC_BRANCH: ${{ github.ref_name }}
          MODE: ${{ matrix.mode }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          src_commit=$(git rev-parse HEAD); src_tree=$(git rev-parse 'HEAD^{tree}')
          mkdir pub && cd pub
          sudo cp -a /hlq-build/out/. .
          sudo chown -R "$(id -u)" .
          for f in *.log; do
            if [ -f "$f" ] && [ "$(wc -l < "$f")" -gt 3000 ]; then
              { head -n 500 "$f"; echo "[…]"; tail -n 2500 "$f"; } > "$f.cut"; mv "$f.cut" "$f"
            fi
          done
          if [ -f harlequin-node.dist ]; then zstd -q -19 --rm harlequin-node.dist; fi
          if [ -f harlequin-node-LAB-rogue-author ]; then zstd -q -19 --rm harlequin-node-LAB-rogue-author; fi
          {
            echo "mode $MODE"
            echo "source-commit $src_commit"
            echo "source-tree $src_tree"
            echo "rc $(cat rc.txt 2>/dev/null || echo missing)"
            if [ -f SHA256SUMS ]; then sed 's/^/sha256 /' SHA256SUMS; fi
          } > status.txt
          cat status.txt
          git init -q -b out
          git config user.name Chief
          git config user.email 254584045+harlequin-chief@users.noreply.github.com
          git add -A
          now="$(date -u +%Y-%m-%dT%H:%M:%S+0000)"
          GIT_AUTHOR_DATE="$now" GIT_COMMITTER_DATE="$now" git commit -q -m "CI $MODE outcome for $src_commit"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "out:refs/heads/ci-out/${MODE}/${SRC_BRANCH}"
